services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./demo_shop.db
      - SECRET_KEY=change-me-to-a-long-random-string
      - DEBUG=true
    volumes:
      - ./app:/code/app

